aid: slauson-and-co
name: Slauson & Co.
description: 'Slauson & Co. is an early-stage venture capital firm based in Los Angeles,
  founded in 2020 by Austin Clements and Ajay Relan and named for the South LA avenue
  where the two first met. Rooted in economic inclusion, the firm invests at the pre-seed
  and seed stage in SMB software tools for the next generation of small-business owners
  and in culturally relevant consumer products and services, backing founders who have
  historically been overlooked by traditional venture capital. Slauson & Co. has raised
  a $100M Fund II — backed by tech companies including Google, Meta and PayPal — and
  runs the Friends & Family accelerator that pairs non-dilutive grants with hands-on
  programming. Portfolio companies include Sienna Naturals, Pressed Roots, A-Frame Brands,
  Charger Help, Bags and Prado.'
